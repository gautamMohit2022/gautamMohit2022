name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"     # runs once a day at midnight UTC
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: gautamMohit2022
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=%237aa2f7&color_dots=%2324283b,%231a1b26,%23414868,%237aa2f7,%2300FF9C

      - name: Push snake output to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
