name: Update Profile Visuals

on:
  schedule:
    - cron: "0 0 * * *"    # runs once a day (midnight UTC)
  workflow_dispatch:         # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # JOB 1 — Snake game that "eats" your contribution graph
  # Output pushed to a separate branch called "output"
  # ------------------------------------------------------------
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from contribution grid
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: gautamMohit2022
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------
  # JOB 2 — Self-hosted metrics card
  # (profile stats, languages, classic contribution calendar)
  # Committed directly to main branch as github-metrics.svg
  # ------------------------------------------------------------
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: update metrics"

          # --- Base sections ---
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # --- Classic contribution calendar (lighter, renders reliably via <img>) ---
          plugin_calendar: yes

          config_timezone: Asia/Kolkata
