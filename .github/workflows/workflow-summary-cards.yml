name: Generate Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"     # runs once a day at midnight UTC
  workflow_dispatch:          # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary cards
        uses: vn7n24fzkq18/github-profile-summary-cards@release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_user: gautamMohit2022
          # Card themes: available themes include github_dark, tokyonight, gotham, github, etc.
          card: >-
            grid, gitHubActivityDaysCard, gitHubActivityGraphCard,
            gitHubStatsCard, gitHubTrophiesCard, gitHubRepoPerLanguageCard,
            gitHubProductiveTimeCard
